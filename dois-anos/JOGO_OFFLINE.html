<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dois Anos</title>
<style>
/* estilo.css — só a moldura. Tudo que é jogo acontece dentro do canvas. */

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #12101c;
  overflow: hidden;
  font-family: "Trebuchet MS", Verdana, sans-serif;
  color: #fff6e6;
  /* Seleção de texto num jogo só serve para o jogador arrastar sem querer
     e ver a tela inteira ficar azul. */
  user-select: none;
  -webkit-user-select: none;
}

#palco {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 40%, #2a2140 0%, #12101c 70%);
}

#jogo {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  /* A sombra faz a tela do jogo parecer um objeto pousado no fundo, e não
     um buraco recortado nele. */
  box-shadow: 0 0 0 2px #3b2b4a, 0 18px 60px rgba(0, 0, 0, 0.6);
  cursor: none;
}

/* ---- tela de carregamento ---- */
#boot {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #12101c;
  z-index: 20;
  transition: opacity 0.6s ease;
}
#boot.sumindo { opacity: 0; pointer-events: none; }
.boot-dentro { text-align: center; }

/* coração em pixels, feito só de sombras — sem imagem, sem fonte */
.boot-coracao {
  width: 8px; height: 8px;
  margin: 0 auto 22px;
  background: transparent;
  box-shadow:
     8px  0    0 0 #ff5a7a,  16px  0   0 0 #ff5a7a,
    32px  0    0 0 #ff5a7a,  40px  0   0 0 #ff5a7a,
     0    8px  0 0 #ff5a7a,   8px  8px 0 0 #ff9db1, 16px 8px 0 0 #ff5a7a,
    24px  8px  0 0 #ff5a7a,  32px  8px 0 0 #ff5a7a, 40px 8px 0 0 #ff5a7a,
    48px  8px  0 0 #ff5a7a,
     0   16px  0 0 #ff5a7a,   8px 16px 0 0 #ff9db1, 16px 16px 0 0 #ff5a7a,
    24px 16px  0 0 #ff5a7a,  32px 16px 0 0 #ff5a7a, 40px 16px 0 0 #ff5a7a,
    48px 16px  0 0 #ff5a7a,
     8px 24px  0 0 #ff5a7a,  16px 24px 0 0 #ff5a7a, 24px 24px 0 0 #ff5a7a,
    32px 24px  0 0 #ff5a7a,  40px 24px 0 0 #ff5a7a,
    16px 32px  0 0 #ff5a7a,  24px 32px 0 0 #ff5a7a, 32px 32px 0 0 #ff5a7a,
    24px 40px  0 0 #ff5a7a;
  animation: bate 1.4s ease-in-out infinite;
  transform-origin: 24px 20px;
}
@keyframes bate {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.16); }
  28% { transform: scale(1); }
  42% { transform: scale(1.1); }
}

.boot-msg {
  margin: 34px 0 0;
  font-size: 13px;
  letter-spacing: 0.14em;
  color: #c3aec0;
  text-transform: lowercase;
}
.boot-antes {
  margin-top: 14px;
  font-size: 11px;
  color: #7d6a84;
  text-decoration: underline;
  cursor: pointer;
}

/* ---- tela de erro ---- */
/* O atributo hidden vale menos que uma regra de id: sem esta linha o
   painel de erro fica visível o tempo todo, por cima do jogo. */
#crash[hidden] { display: none !important; }

#crash {
  position: fixed;
  inset: 0;
  background: rgba(12, 8, 18, 0.96);
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  box-sizing: border-box;
}
.crash-dentro { max-width: 780px; width: 100%; }
.crash-titulo { font-size: 20px; color: #ff6b6b; margin: 0 0 12px; }
#crash-msg {
  background: #1c1524;
  border: 1px solid #3b2b4a;
  padding: 12px;
  max-height: 46vh;
  overflow: auto;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
  color: #d8cfe0;
}
.crash-acoes { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
.crash-acoes button {
  background: #3b2b4a;
  border: 1px solid #ffd98a;
  color: #fff6e6;
  padding: 8px 16px;
  font-size: 12px;
  letter-spacing: 0.1em;
  cursor: pointer;
}
.crash-acoes button:hover { background: #5a3f6e; }
#crash-copiado { font-size: 12px; color: #9fe08a; }
.crash-dica { font-size: 12px; color: #9c8ea4; margin-top: 12px; }

</style>
</head>
<body>
  <div id="palco">
    <canvas id="jogo" width="480" height="270"></canvas>
  </div>

  <div id="boot">
    <div class="boot-dentro">
      <div class="boot-coracao"></div>
      <p class="boot-msg" id="boot-msg">carregando&#8230;</p>
      <p class="boot-antes" id="boot-antes" hidden>ver o último erro</p>
    </div>
  </div>

  <div id="crash" hidden>
    <div class="crash-dentro">
      <p class="crash-titulo">O jogo travou.</p>
      <pre id="crash-msg"></pre>
      <div class="crash-acoes">
        <button id="crash-copiar" type="button">COPIAR ERRO</button>
        <button id="crash-recarregar" type="button">RECARREGAR</button>
        <span id="crash-copiado"></span>
      </div>
      <p class="crash-dica">Clica em COPIAR ERRO e cola no chat. É esse texto que diz o que quebrou.</p>
    </div>
  </div>

  <script>
    // Rede de segurança. Um módulo que explode em silêncio deixa a tela
    // preta e sem pista nenhuma; aqui o erro vira texto que dá pra copiar
    // com um clique. Vale mais do que qualquer descrição do que se viu.
    (function () {
      var CHAVE = 'doisanos.ultimoErro';

      function ambiente() {
        var g = window.jogo;
        var l = [
          'navegador: ' + navigator.userAgent,
          'tela: ' + window.innerWidth + 'x' + window.innerHeight +
            ' dpr' + (window.devicePixelRatio || 1),
          'url: ' + location.href,
        ];
        if (g) {
          l.push('estado: ' + g.estado + '  fps: ' + (g.fps ? g.fps.toFixed(0) : '-'));
          if (g.nivel && g.nivel.jogador) {
            l.push('fase: ' + g.nivel.numero +
              '  x=' + Math.round(g.nivel.jogador.x) +
              '  y=' + Math.round(g.nivel.jogador.y));
          }
        } else {
          l.push('estado: o jogo nem chegou a carregar');
          var b = document.getElementById('boot-msg');
          if (b) l.push('parou em: "' + b.textContent + '"');
        }
        return l.join('\n');
      }

      function mostrar(titulo, detalhe) {
        var box = document.getElementById('crash');
        var msg = document.getElementById('crash-msg');
        if (!box || box.hidden === false) return;
        var t = titulo + '\n\n' + detalhe + '\n\n--- ambiente ---\n' + ambiente();
        box.hidden = false;
        msg.textContent = t;
        try { localStorage.setItem(CHAVE, t); } catch (e) { /* sem espaço */ }
      }
      window.__crash = mostrar;

      window.addEventListener('error', function (e) {
        mostrar(e.message || 'erro desconhecido',
          (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0) + '\n\n' +
          (e.error && e.error.stack ? e.error.stack : '(sem pilha)'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        mostrar('Promise rejeitada', (r && r.stack) ? r.stack : String(r));
      });

      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('crash-copiar').addEventListener('click', function () {
          var t = document.getElementById('crash-msg').textContent;
          var aviso = document.getElementById('crash-copiado');
          function ok() { aviso.textContent = 'copiado'; }
          function reserva() {
            var ta = document.createElement('textarea');
            ta.value = t; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); ok(); }
            catch (e) { aviso.textContent = 'seleciona o texto e copia à mão'; }
            document.body.removeChild(ta);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t).then(ok, reserva);
          } else reserva();
        });
        document.getElementById('crash-recarregar').addEventListener('click', function () {
          location.reload();
        });

        var antes = null;
        try { antes = localStorage.getItem(CHAVE); } catch (e) { /* sem acesso */ }
        if (antes) {
          var link = document.getElementById('boot-antes');
          link.hidden = false;
          link.addEventListener('click', function () {
            document.getElementById('crash').hidden = false;
            document.getElementById('crash-msg').textContent = antes;
          });
        }

        // Vigia do carregamento: um módulo que não chega não dispara erro
        // nenhum, e a tela fica pulsando "carregando..." para sempre.
        setTimeout(function () {
          var g = window.jogo;
          if (g && g.estado && g.estado !== 'boot') return;
          var p = (document.getElementById('boot-msg') || {}).textContent || '?';
          mostrar('O jogo não terminou de carregar', g
            ? 'Os módulos carregaram, mas a montagem não terminou.\nParou em: "' + p + '"'
            : 'Os módulos JavaScript não carregaram.\n\n' +
              'Causa quase certa: a página foi aberta sem servidor local.\n' +
              'Use o JOGO_OFFLINE.html, que abre com dois cliques.');
        }, 15000);
      });
    })();
  </script>
<script>
(function(){
var __mods = {}, __cache = {};
function __req(id){
  if (__cache[id]) return __cache[id];
  var e = {}; __cache[id] = e;
  if (!__mods[id]) throw new Error("modulo ausente no pacote: " + id);
  __mods[id](e); return e;
}
__mods["core/gfx.js"] = function(__exp){
// gfx.js — o pipeline de imagem.
//
// Mesma regra de ouro do outro jogo: TUDO é desenhado numa tela interna de
// 480x270 e o navegador só amplia no fim, com nearest-neighbor, pra que o
// pixel nunca borre.
//
// O que muda aqui é a intenção. No jogo de terror a cena era multiplicada
// por uma luz quase preta e a cor morria de propósito. Este é um jogo de
// dia (e de noite bonita), então a luz ambiente padrão é BRANCA: multiplicar
// por branco não muda nada, e a cor sai do jeito que foi pintada. O buffer
// de luz continua existindo porque a floresta de vaga-lumes e a cidade à
// noite precisam dele — lá a ambiente escurece e cada luzinha soma de volta.
//
// Ordem de um frame:
//   gfx.limpar(cor)          fundo
//   ... desenha o mundo ...  em gfx.s
//   gfx.luzInicio(ambiente)  só se a fase for escura
//   ... gfx.luz(x,y,r,cor)   cada vaga-lume, poste, brilho
//   gfx.luzFim()             multiplica a luz e soma o halo
//   ... desenha a interface  (depois da luz, senão ela escurece junto)
//   gfx.apresentar(dt)       tremida, fade, flash, barras, e o upscale

const VW = 480;
const VH = 270;

function makeBuffer(w, h, alpha = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { alpha });
  x.imageSmoothingEnabled = false;
  return { c, x };
}

// Ruído determinístico: mesma semente, mesmo resultado. Serve pra areia,
// estrela, folhagem — coisas que precisam parecer aleatórias e idênticas a
// cada carregamento, senão o cenário pisca quando é reconstruído.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
// Volta um pouco além e retorna — o que dá "peso" a menu abrindo e a item
// aparecendo. Sem isso tudo entra em velocidade constante e parece morto.
const easeBack = t => {
  const c = 1.70158, u = t - 1;
  return u * u * ((c + 1) * u + c) + 1;
};
const easeElastic = t => {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -9 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
};

function hexToRgb(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHex(r, g, b) {
  const f = v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
}

// Mistura duas cores hex. Usada o tempo todo pelo céu e pela água.
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}

class Gfx {
  constructor() {
    this.escala = 1;
    this.tremorForca = 0;
    this.tremorTempo = 0;
    this.tremorX = 0;
    this.tremorY = 0;
    this.fade = 0;                  // 0 = nada, 1 = cor cheia
    this.fadeCor = '#000000';
    this.flash = 0;
    this.flashCor = '#ffffff';
    this.barras = 0;                // 0..1 — altura das barras de cinema
    this.vinheta = 0.26;            // discreta: só fecha os cantos
    this.grao = 0;                  // desligado por padrão; a arte é limpa
    this.tempo = 0;
    this.usandoLuz = false;
    this.pixelExato = false;
  }

  init() {
    this.saida = document.getElementById('jogo');
    this.o = this.saida.getContext('2d', { alpha: false });
    this.o.imageSmoothingEnabled = false;

    const cena = makeBuffer(VW, VH, false);
    this.cenaC = cena.c; this.s = cena.x;

    const luz = makeBuffer(VW, VH, false);
    this.luzC = luz.c; this.l = luz.x;

    // Buffer de brilho em 1/4 da resolução. Ampliar de volta com suavização
    // LIGADA é um blur gaussiano de pobre — é isso que faz o vaga-lume ter
    // halo em vez de borda dura.
    const halo = makeBuffer(VW >> 2, VH >> 2);
    this.haloC = halo.c; this.h = halo.x;
    this.h.imageSmoothingEnabled = true;

    const tmp = makeBuffer(VW, VH);
    this.tmpC = tmp.c; this.t = tmp.x;

    const tmp2 = makeBuffer(VW, VH);
    this.tmp2C = tmp2.c; this.t2 = tmp2.x;

    this._montarGrao();
    this._montarVinheta();

    this.redimensionar();
    window.addEventListener('resize', () => this.redimensionar());
    return this;
  }

  _montarGrao() {
    this.graos = [];
    const rnd = mulberry32(0x5EED);
    for (let i = 0; i < 4; i++) {
      const b = makeBuffer(VW, VH);
      const img = b.x.createImageData(VW, VH);
      const d = img.data;
      for (let p = 0; p < d.length; p += 4) {
        const v = (rnd() * 255) | 0;
        d[p] = v; d[p + 1] = v; d[p + 2] = v; d[p + 3] = 255;
      }
      b.x.putImageData(img, 0, 0);
      this.graos.push(b.c);
    }
    this.graoIdx = 0; this.graoT = 0;
  }

  _montarVinheta() {
    const b = makeBuffer(VW, VH);
    const g = b.x.createRadialGradient(VW / 2, VH / 2, VH * 0.42, VW / 2, VH / 2, VH * 1.05);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(20,10,30,1)');
    b.x.fillStyle = g;
    b.x.fillRect(0, 0, VW, VH);
    this.vinhetaC = b.c;
  }

  redimensionar() {
    const lp = window.innerWidth, ap = window.innerHeight;
    let e = Math.min(lp / VW, ap / VH);
    // Escala inteira deixa cada pixel do jogo com exatamente o mesmo tamanho
    // na tela. Fica mais nítido, mas sobra tarja preta; por isso é opção.
    if (this.pixelExato) e = Math.max(1, Math.floor(e));
    this.escala = e;
    this.saida.width = Math.round(VW * e);
    this.saida.height = Math.round(VH * e);
    this.saida.style.width = Math.round(VW * e) + 'px';
    this.saida.style.height = Math.round(VH * e) + 'px';
    this.o = this.saida.getContext('2d', { alpha: false });
    this.o.imageSmoothingEnabled = false;
  }

  limpar(cor) {
    const s = this.s;
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.globalAlpha = 1;
    s.globalCompositeOperation = 'source-over';
    s.imageSmoothingEnabled = false;
    if (cor) { s.fillStyle = cor; s.fillRect(0, 0, VW, VH); }
    else s.clearRect(0, 0, VW, VH);
    this.usandoLuz = false;
  }

  // ---- luz ----------------------------------------------------------------

  luzInicio(ambiente = '#ffffff') {
    this.usandoLuz = true;
    const l = this.l;
    l.setTransform(1, 0, 0, 1, 0, 0);
    l.globalCompositeOperation = 'source-over';
    l.globalAlpha = 1;
    l.fillStyle = ambiente;
    l.fillRect(0, 0, VW, VH);
    l.globalCompositeOperation = 'lighter';
  }

  // Uma luz é um degradê radial somado ao buffer. `forca` acima de 1 estoura
  // o branco — é o que vira halo no passe de brilho.
  luz(x, y, raio, cor = '#ffffff', forca = 1) {
    if (!this.usandoLuz || raio <= 0) return;
    if (x + raio < 0 || x - raio > VW || y + raio < 0 || y - raio > VH) return;
    const l = this.l;
    const g = l.createRadialGradient(x, y, 0, x, y, raio);
    const [r, gg, b] = hexToRgb(cor);
    g.addColorStop(0, `rgba(${r},${gg},${b},${clamp(forca, 0, 2)})`);
    g.addColorStop(0.45, `rgba(${r},${gg},${b},${clamp(forca * 0.42, 0, 1)})`);
    g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    l.fillStyle = g;
    l.fillRect(x - raio, y - raio, raio * 2, raio * 2);
  }

  luzFim(brilho = 0.55) {
    if (!this.usandoLuz) return;
    const s = this.s;
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.globalAlpha = 1;

    // 1. multiplica: onde a luz é branca a cena não muda; onde é escura ela
    //    apaga. É por isso que ambiente branca custa nada visualmente.
    s.globalCompositeOperation = 'multiply';
    s.drawImage(this.luzC, 0, 0);

    // 2. halo: a luz reduzida a 1/4 e devolvida grande e suave, somada.
    if (brilho > 0) {
      const h = this.h;
      h.setTransform(1, 0, 0, 1, 0, 0);
      h.globalCompositeOperation = 'source-over';
      h.globalAlpha = 1;
      h.clearRect(0, 0, this.haloC.width, this.haloC.height);
      h.drawImage(this.luzC, 0, 0, this.haloC.width, this.haloC.height);
      s.globalCompositeOperation = 'lighter';
      s.globalAlpha = brilho;
      s.imageSmoothingEnabled = true;
      s.drawImage(this.haloC, 0, 0, VW, VH);
      s.imageSmoothingEnabled = false;
    }
    s.globalAlpha = 1;
    s.globalCompositeOperation = 'source-over';
    this.usandoLuz = false;
  }

  // ---- efeitos de tela ----------------------------------------------------

  tremer(forca, tempo = 0.25) {
    this.tremorForca = Math.max(this.tremorForca, forca);
    this.tremorTempo = Math.max(this.tremorTempo, tempo);
  }

  piscar(cor = '#ffffff', forca = 0.7) {
    this.flashCor = cor;
    this.flash = Math.max(this.flash, forca);
  }

  // ---- saída --------------------------------------------------------------

  apresentar(dt) {
    this.tempo += dt;

    if (this.tremorTempo > 0) {
      this.tremorTempo -= dt;
      const k = Math.max(0, this.tremorTempo) * this.tremorForca;
      this.tremorX = (Math.random() * 2 - 1) * k * 9;
      this.tremorY = (Math.random() * 2 - 1) * k * 9;
      if (this.tremorTempo <= 0) { this.tremorForca = 0; this.tremorX = this.tremorY = 0; }
    }

    const s = this.s;
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.globalAlpha = 1;
    s.globalCompositeOperation = 'source-over';

    if (this.vinheta > 0) {
      s.globalAlpha = this.vinheta;
      s.drawImage(this.vinhetaC, 0, 0);
      s.globalAlpha = 1;
    }

    if (this.grao > 0) {
      this.graoT += dt;
      if (this.graoT > 1 / 18) { this.graoT = 0; this.graoIdx = (this.graoIdx + 1) % this.graos.length; }
      s.globalCompositeOperation = 'overlay';
      s.globalAlpha = this.grao;
      s.drawImage(this.graos[this.graoIdx], 0, 0);
      s.globalAlpha = 1;
      s.globalCompositeOperation = 'source-over';
    }

    if (this.flash > 0) {
      s.globalAlpha = clamp(this.flash, 0, 1);
      s.fillStyle = this.flashCor;
      s.fillRect(0, 0, VW, VH);
      s.globalAlpha = 1;
      this.flash = Math.max(0, this.flash - dt * 3.2);
    }

    if (this.barras > 0) {
      const h = Math.round(VH * 0.13 * clamp(this.barras, 0, 1));
      s.fillStyle = '#000000';
      s.fillRect(0, 0, VW, h);
      s.fillRect(0, VH - h, VW, h);

  const sap = SAPATOS[clamp(look.corSapato | 0, 0, SAPATOS.length - 1)];
  const iris = OLHOS[clamp(look.olhoCor | 0, 0, OLHOS.length - 1)];

  return {
    t: pe[0], S: pe[1], s: pe[2], q: pe[3],
    // O rubor não é uma cor nova: é a pele puxada para o rosa. Assim ele
    // funciona em pele clara e em pele escura sem virar mancha.
    r: mixHex(pe[1], '#ff6f8f', 0.30),
    // Sarda: a própria sombra da pele, um degrau mais quente.
    f: mixHex(pe[2], '#8a4a22', 0.35),

    g: cb[0], h: cb[1], H: cb[2],
    // Cílio e sobrancelha seguem o cabelo, mas sempre mais escuros — cílio
    // da cor exata do cabelo some no cabelo.
    o: mixHex(cb[2], '#1a1018', 0.45),

    A: cima[0], a: cima[1], n: cima[2],
    B: baixo[0], b: baixo[1], m: baixo[2],
    P: sap[0], p: sap[1], d: sap[2],

    E: ESCLERA, e: PUPILA, i: iris, w: BRILHO_OLHO,
    k: COR.linha,
    y: '#ffd76e',        // metal do brinco e da fivela
    Y: '#b98b2e',
    W: '#ffffff',
    x: '#00000055',      // sombra translúcida
  };
}

// ---------------------------------------------------------------------------
// grades editáveis
// ---------------------------------------------------------------------------
function grade(linhas) { return linhas.map(l => l.split('')); }
function texto(g) { return g.map(l => l.join('')); }

// Carimba `linhas` em cima da grade a partir de (cx, cy). Ponto vira
// "não mexe": é o que deixa desenhar um olho por cima de um rosto pronto.
function estampar(g, cx, cy, linhas) {
  for (let y = 0; y < linhas.length; y++) {
    const gy = cy + y;
    if (gy < 0 || gy >= g.length) continue;
    for (let x = 0; x < linhas[y].length; x++) {
      const c = linhas[y][x];
      if (c === '.') continue;
      const gx = cx + x;
      if (gx < 0 || gx >= g[gy].length) continue;
      g[gy][gx] = c;
    }
  }
}

function px(g, x, y, c) {
  if (y >= 0 && y < g.length && x >= 0 && x < g[y].length) g[y][x] = c;
}

// ---------------------------------------------------------------------------
// a cabeça
// ---------------------------------------------------------------------------
// Vista de três quartos virada para a DIREITA: o rosto ocupa a metade
// direita da grade, a orelha fica na esquerda e o nariz sai da silhueta.
// Um rosto simétrico nesta altura lê como "de costas".
const CRANIO = [
  '........qqqqqq........',
  '......qqSSSSSSqq......',
  '.....qSSSSSSSSSSq.....',
  '.....qSSSSSSSSSSq.....',
  '....qSSSSSSSSSSSSq....',
  '....qSSSSSSSSSSSSq....',
  '....qSSSSSSSSSSSSq....',
  '....qSSSSSSSSSSSSq....',
  '....qSSSSSSSSSSSSq....',
  '....qSSSSSSSSSSSSq....',
  '....qSSSSSSSSSSSSq....',
  '.....qSSSSSSSSSSq.....',
  '.....qSSSSSSSSSq......',
  '......qSSSSSSSq.......',
  '.......qqSSSSqq.......',
];

// olho: [colunaÂncora, linhaÂncora, linhas]
// LINHAS DO ROSTO — a coisa mais importante deste arquivo.
//   1-6   testa (é aqui que a franja mora)
//   6     sobrancelha
//   7-9   olho
//   10    nariz
//   10-11 maçã do rosto (rubor)
//   11-12 boca
//   13-14 queixo
// O olho fica a uns 60% da altura da cabeça, não no meio: rosto com olho
// no centro lê como adulto, e é a testa alta que faz a cara ser fofa.
// A primeira versão tinha o olho em 5-7 e a franja comia ele inteiro: a
// personagem ficava sem rosto. Vale repetir porque é fácil de reintroduzir
// mexendo em qualquer um dos dois.
const OLHO_FORMAS = [
  // redondo — o padrão. Cílio em cima, íris, pupila e um brilho na quina
  // da frente. O brilho é UM pixel branco e é ele que dá vida ao rosto;
  // sem ele o olho vira um furo.
  { cx: 11, cy: 7, linhas: ['.oooo', '.Eiew', '..qq.'] },
  // amendoado — cílio embaixo também, o que fecha a abertura do olho
  { cx: 11, cy: 7, linhas: ['.oooo', '.Eiew', '.ooq.'] },
  // grande — uma linha a mais de íris
  { cx: 11, cy: 7, linhas: ['.oooo', 'EEiew', '.Eiee', '..qq.'] },
];

const SOBRANCELHAS = [
  { cx: 12, cy: 6, linhas: ['..oo'] },          // fina
  { cx: 12, cy: 6, linhas: ['.ooo'] },          // média
  { cx: 12, cy: 5, linhas: ['.ooo', 'oo..'] },  // marcada
];

const BOCAS = [
  // sorriso: o canto sobe. Um pixel a mais em cima na ponta e o rosto
  // inteiro muda de humor.
  { cx: 13, cy: 11, linhas: ['..k', 'kk.'] },
  { cx: 13, cy: 12, linhas: ['kk'] },           // discreta
  { cx: 13, cy: 11, linhas: ['.kk', 'kee'] },   // aberta
];

// Óculos e brinco são peça SEPARADA porque vão por cima do cabelo. Na
// primeira versão eles moravam junto com o rosto, e a franja — que é
// desenhada depois — apagava os dois.
const OCULOS = [
  null,
  // redondo
  { cx: 9, cy: 7, linhas: ['.kkk.kkk', 'k...k...k', 'k..kWk..k', '.kkk.kkk.'] },
  // retangular
  { cx: 9, cy: 7, linhas: ['kkkkkkkkk', 'k...k...k', 'kkkkkkkkk'] },
  // de sol — lente cheia, escura
  { cx: 9, cy: 7, linhas: ['kkkkkkkkk', 'kkkkkkkWk', 'kkkkkkkkk', '.kkk.kkk.'] },
];

const BRINCOS = [
  null,
  { cx: 5, cy: 12, linhas: ['y', 'Y'] },             // argola
  { cx: 5, cy: 12, linhas: ['y', '.', 'y'] },        // pingente
];

function construirCabeca(look, piscando) {
  const g = grade(CRANIO);

  // orelha (some debaixo do cabelo na maioria dos estilos, e tudo bem)
  estampar(g, 5, 9, ['.s', 'qS', '.s']);
  // nariz: uma sombra de um pixel. Saliência de verdade nesta escala vira
  // focinho — o que dá o volume é a sombra, não o contorno.
  px(g, 16, 10, 's');

  const sob = SOBRANCELHAS[clamp(look.sobrancelha | 0, 0, 2)];
  estampar(g, sob.cx, sob.cy, sob.linhas);

  const olho = OLHO_FORMAS[clamp(look.olhoForma | 0, 0, 2)];
  if (piscando) {
    // Olho fechado é o cílio virando uma curva para baixo. Dois quadros de
    // piscada de vez em quando é o que separa "boneco" de "alguém ali".
    estampar(g, olho.cx, olho.cy + 1, ['.oooo', '..oo.']);
  } else {
    estampar(g, olho.cx, olho.cy, olho.linhas);
  }

  const boca = BOCAS[clamp(look.boca | 0, 0, 2)];
  estampar(g, boca.cx, boca.cy, boca.linhas);

  if (look.blush) {
    // Duas fileiras curtas e deslocadas na maçã do rosto. Um retângulo
    // cheio de rubor parece adesivo colado no rosto.
    px(g, 11, 10, 'r'); px(g, 12, 10, 'r');
    px(g, 12, 11, 'r'); px(g, 13, 11, 'r');
  }
  if (look.sardas) {
    px(g, 12, 10, 'f'); px(g, 15, 10, 'f');
    px(g, 13, 11, 'f'); px(g, 16, 11, 'f');
  }

  return texto(g);
}

// Óculos e brinco, na mesma grade da cabeça, para irem por cima do cabelo.
function construirAcessorios(look) {
  const oc = OCULOS[clamp(look.oculos | 0, 0, 3)];
  const br = BRINCOS[clamp(look.brinco | 0, 0, 2)];
  if (!oc && !br) return null;
  const g = grade(new Array(15).fill('.'.repeat(22)));
  if (oc) estampar(g, oc.cx, oc.cy, oc.linhas);
  if (br) estampar(g, br.cx, br.cy, br.linhas);
  return texto(g);
}

// ---------------------------------------------------------------------------
// O tronco muda com a roupa: manga curta deixa braço de pele, jardineira
// tem alça, vestido não tem cós. O que NÃO muda é a silhueta — ombro e
// quadril ficam no mesmo lugar sempre, senão as animações desalinham.

function troncoDe(look) {
  const roupa = clamp(look.roupa | 0, 0, 3);
  const base = [
    '.....SSS....',
    '.....SSs....',
    '...kkaaakk..',
    '..kaaaaaaAk.',
    '..kaaaaaaAk.',
    '..knaaaaaAk.',
    '..knaaaaaAk.',
    '..knaaaaaAk.',
    '..knaaaaaAk.',
    '..knaaaaaAk.',
    '..knaaaaaAk.',
    '..knaaaaaAk.',
    '..knaaaaaAk.',
    '...knaaaAk..',
    '....kkkkk...',
  ];
  const g = grade(base);
  if (roupa === 0) {
    // camiseta: gola redonda, barra clara
    estampar(g, 4, 2, ['.AA.']);
    estampar(g, 2, 12, ['kAAAAAAAk']);
  } else if (roupa === 1) {
    // vestido: cintura marcada por uma faixa mais escura
    estampar(g, 2, 9, ['knnnnnnnk']);
  } else if (roupa === 2) {
    // blusa: barra reta e um botão
    estampar(g, 8, 5, ['A']);
    estampar(g, 8, 8, ['A']);
    estampar(g, 2, 13, ['.kBBBBk..']);
  } else {
    // jardineira: peitilho da cor de baixo, com alça e fivela
    estampar(g, 4, 3, ['BBBBB', 'BBBBB', 'BBBBB', 'BBBBB', 'BBBBB',
                       'BBBBB', 'BBBBB', 'BBBBB', 'BBBBB', 'BBBBB']);
    estampar(g, 3, 3, ['B', 'B']);
    estampar(g, 5, 4, ['y']);
    estampar(g, 8, 4, ['y']);
  }
  return texto(g);
}

// Saia / vestido caindo do quadril. Pivô no topo, no centro do quadril.
function saiaDe(look) {
  const roupa = clamp(look.roupa | 0, 0, 3);
  if (roupa === 1) {
    return { pivot: [7, 0], linhas: [
      '...kaaaaak....',
      '..kaaaaaaAk...',
      '..kaaaaaaAk...',
      '.kaaaaaaaaAk..',
      '.kaaaaaaaaAk..',
      'knaaaaaaaaaAk.',
      'knaaaaaaaaaAk.',
      'knnaaaaaaaaAk.',
      '.kkkkkkkkkkk..',
    ] };
  }
  return null;
}

function membrosDe(look) {
  const roupa = clamp(look.roupa | 0, 0, 3);
  // manga: 0 curta (camiseta), 1 curta (vestido), 2 comprida (blusa), 3 nua
  const mangaLonga = roupa === 2;
  // Contorno só na borda de trás. Braço de 3 pixels com contorno dos DOIS
  // lados sobra um pixel de carne no meio e vira um risco preto atravessado
  // no peito.
  const bracoSup = mangaLonga
    ? ['kaA', 'kaA', 'kaA', 'kaA', 'kaA', 'kaA', 'kSt']
    : ['kaA', 'kaA', 'kSt', 'kSt', 'kSt', 'kSt', 'kSt'];
  const bracoInf = mangaLonga
    ? ['kaA', 'kaA', 'kaA', 'kaA', 'kSt', 'kSt']
    : ['kSt', 'kSt', 'kSt', 'kSt', 'kSt', 'kSt'];

  // perna: calça cobre até o tornozelo; shorts até a coxa; vestido e saia
  // deixam a perna nua.
  const calca = roupa === 2 || roupa === 3;
  const shorts = roupa === 0;

  const coxa = calca
    ? ['kbbB', 'kbbB', 'kbbB', 'kbbB', 'kbbB', 'kbbB', 'kbbB']
